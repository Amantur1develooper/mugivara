{% load static %}
<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — Кабинет автосалона</title>
<style>
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg,#0d1117,#1c2535); font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  }
  .box{
    width:100%; max-width:360px; background:#fff; border-radius:22px; padding:36px 30px;
    box-shadow:0 30px 80px rgba(0,0,0,.35);
  }
  .logo{ font-size:17px; font-weight:900; letter-spacing:-.4px; margin-bottom:2px; text-align:center; }
  .logo span{ color:#0a84ff; }
  .sub{ font-size:12.5px; color:#667085; text-align:center; margin-bottom:26px; }
  .field{ margin-bottom:14px; }
  input{
    width:100%; padding:13px 15px; border-radius:12px; border:1.5px solid rgba(16,24,40,.1);
    background:#f9fafb; font-size:14px; outline:none; font-family:inherit; box-sizing:border-box;
    transition:border-color .15s;
  }
  input:focus{ border-color:#0a84ff; background:#fff; }
  button{
    width:100%; padding:14px; border-radius:12px; border:none; cursor:pointer;
    background:linear-gradient(135deg,#0a84ff,#0066cc); color:#fff; font-weight:800; font-size:14px;
    font-family:inherit; margin-top:6px; transition:opacity .15s;
  }
  button:hover{ opacity:.9; }
  .err{ background:rgba(239,68,68,.08); border:1px solid rgba(239,68,68,.2); color:#b42318;
        padding:10px 14px; border-radius:10px; font-size:12.5px; font-weight:600; margin-bottom:14px; }
</style>
</head>
<body>
  <div class="box">
    <div class="logo">🚗 Webordo <span>Авто</span></div>
    <div class="sub">Личный кабинет автосалона</div>
    {% if messages %}
      {% for message in messages %}<div class="err">{{ message }}</div>{% endfor %}
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="field"><input type="text" name="username" placeholder="Логин" required autofocus></div>
      <div class="field"><input type="password" name="password" placeholder="Пароль" required></div>
      <button type="submit">Войти</button>
    </form>
  </div>
</body>
</html>
