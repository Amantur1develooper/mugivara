{% comment %}Стили отзывов: одни на страницу филиала и страницу ресторана.{% endcomment %}
<style>
  .rv-tabs{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
  .rv-tab{
    padding:8px 14px; border-radius:10px; font-size:12.5px; font-weight:700;
    border:1.5px solid var(--border); background:var(--card); color:var(--muted);
  }
  .rv-tab.active{ border-color:var(--accent); background:rgba(255,77,28,.08); color:var(--accent); }
  .rv-card{
    background:var(--card); border:1.5px solid var(--border); border-radius:16px;
    padding:16px 18px; margin-bottom:12px;
  }
  .rv-card.hidden-rv{ opacity:.6; border-style:dashed; }
  .rv-top{ display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; }
  .rv-who{ font-weight:800; font-size:14px; }
  .rv-phone{ font-size:12.5px; font-weight:700; color:var(--accent); }
  .rv-date{ font-size:11.5px; color:var(--muted); margin-left:auto; }
  .rv-tag{
    font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:999px;
    background:var(--bg); border:1px solid var(--border); color:var(--muted);
  }
  .rv-text{ font-size:13.5px; line-height:1.55; margin-top:8px; word-break:break-word; }
  .rv-form{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; align-items:flex-start; }
  .rv-reply{
    flex:1; min-width:220px; padding:10px 13px; border-radius:11px; font-size:13px;
    font-family:inherit; border:1.5px solid var(--border); background:var(--bg);
    color:var(--text); outline:none; resize:vertical; min-height:42px;
  }
  .rv-reply:focus{ border-color:var(--accent); }
  .rv-privacy{
    background:rgba(255,77,28,.06); border:1px solid rgba(255,77,28,.18);
    border-radius:14px; padding:13px 16px; font-size:12.5px; line-height:1.5;
    color:var(--text2); margin-bottom:18px;
  }


  .rv-edit{margin-top:10px;padding-top:12px;border-top:1px dashed var(--border)}
  .rv-edit-note{font-size:12px;color:var(--muted);margin-bottom:8px}
  .rv-edit-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
  @media (max-width:560px){ .rv-edit-row{grid-template-columns:1fr} }
  .rv-add{background:var(--card);border:1.5px dashed var(--border);border-radius:18px;
          padding:16px;margin-bottom:16px}
  .rv-add summary{cursor:pointer;font-weight:700}
</style>
<script>
  // Правка отзыва прячется, пока её не позовут: обычный сценарий —
  // ответить, а не переписывать слова гостя.
  function toggleEdit(id){
    const box = document.getElementById('rv-edit-' + id);
    const txt = document.getElementById('rv-text-' + id);
    const open = box.style.display === 'none';
    box.style.display = open ? '' : 'none';
    txt.style.opacity = open ? .45 : 1;
  }
</script>
