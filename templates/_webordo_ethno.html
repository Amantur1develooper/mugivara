{% comment %}
  Кыргызский этно-фон Webordo — орнаменты вразнобой, разного размера,
  с разной скоростью вращения. Подключается на всех страницах платформы
  сразу после <body>. Слой на z-index:-1 — контенту менять ничего не нужно.
{% endcomment %}
<style>
  .kg-ethno-bg{
    position:fixed; inset:0; z-index:-1; pointer-events:none; overflow:hidden;
    color:#FF6A17; filter:blur(1px);
  }
  .kg-ethno-bg::after{
    content:''; position:absolute; inset:0;
    background:
      radial-gradient(ellipse 55% 42% at 5% 0%, rgba(255,122,26,.10), transparent 62%),
      radial-gradient(ellipse 55% 45% at 96% 100%, rgba(255,77,28,.08), transparent 62%);
  }
  .kg-orn{ position:absolute; will-change:transform; animation:kg-drift 32s ease-in-out infinite; }
  .kg-orn > i{ display:block; width:100%; height:100%; animation:kg-spin 120s linear infinite; }
  .kg-orn svg{ width:100%; height:100%; display:block; overflow:visible; }

  .kg-orn.a{ width:300px;height:300px; top:-80px;  left:-90px;  opacity:.14; animation-duration:31s; }
  .kg-orn.a > i{ animation-duration:118s; }
  .kg-orn.b{ width:165px;height:165px; top:7%;   left:25%;   opacity:.09; animation-delay:-6s;  animation-duration:25s; }
  .kg-orn.b > i{ animation-duration:54s;  animation-direction:reverse; }
  .kg-orn.c{ width:210px;height:210px; top:3%;   right:9%;   opacity:.11;  animation-delay:-13s; animation-duration:35s; }
  .kg-orn.c > i{ animation-duration:96s; }
  .kg-orn.d{ width:270px;height:270px; top:37%;  left:-70px; opacity:.12;  animation-delay:-4s;  animation-duration:41s; }
  .kg-orn.d > i{ animation-duration:150s; animation-direction:reverse; }
  .kg-orn.e{ width:360px;height:360px; top:calc(46% - 180px); left:calc(50% - 180px); opacity:.06; animation-delay:-20s; animation-duration:49s; }
  .kg-orn.e > i{ animation-duration:230s; }
  .kg-orn.f{ width:220px;height:220px; top:53%;  right:-55px; opacity:.11; animation-delay:-9s;  animation-duration:27s; }
  .kg-orn.f > i{ animation-duration:68s;  animation-direction:reverse; }
  .kg-orn.g{ width:185px;height:185px; top:75%;  left:5%;    opacity:.09;  animation-delay:-17s; animation-duration:33s; }
  .kg-orn.g > i{ animation-duration:84s; }
  .kg-orn.h{ width:260px;height:120px; top:88%;  left:41%;   opacity:.08;  animation-delay:-11s; animation-duration:37s; }
  .kg-orn.h > i{ animation:none; }
  .kg-orn.i{ width:290px;height:290px; bottom:-90px; right:-70px; opacity:.12; animation-delay:-25s; animation-duration:39s; }
  .kg-orn.i > i{ animation-duration:162s; animation-direction:reverse; }
  .kg-orn.j{ width:145px;height:145px; top:19%;  right:3%;   opacity:.08;  animation-delay:-7s;  animation-duration:23s; }
  .kg-orn.j > i{ animation-duration:59s; }

  @keyframes kg-spin{ to{ transform:rotate(360deg); } }
  @keyframes kg-drift{ 0%,100%{transform:translate(0,0);} 50%{transform:translate(20px,-24px);} }

  @media (max-width:640px){
    .kg-ethno-bg{ filter:blur(1.2px); }
    .kg-orn.b,.kg-orn.g,.kg-orn.j,.kg-orn.h{ display:none; }
    .kg-orn.a{ width:210px;height:210px; top:-60px; left:-70px; }
    .kg-orn.c{ width:150px;height:150px; }
    .kg-orn.d{ width:200px;height:200px; left:-60px; }
    .kg-orn.e{ width:260px;height:260px; top:calc(42% - 130px); left:calc(50% - 130px); }
    .kg-orn.f{ width:160px;height:160px; }
    .kg-orn.i{ width:200px;height:200px; bottom:-60px; right:-50px; }
  }
  @media (prefers-reduced-motion:reduce){ .kg-orn,.kg-orn > i{ animation:none !important; } }
</style>

  </g>
  <g id="kg-omurtka" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">

    <path d="M120 78 C120 42 168 42 168 78 C168 102 140 102 146 80"/>

</defs></svg>

  <div class="kg-orn a"><i><svg viewBox="0 0 240 220"><use href="#kg-koshkor"/></svg></i></div>

</div>
