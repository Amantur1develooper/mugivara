<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Та же буква, что у сайта, но зелёная: кабинет держат открытым
       рядом с самим сайтом, и во вкладках их надо различать не
       вчитываясь. Цвет фирменный, теми же токенами, что в кабинете. -->
  <defs>
    <linearGradient id="w" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#19CDA8"/>
      <stop offset="1" stop-color="#00B896"/>
    </linearGradient>
  </defs>
  <path d="M12 21 L31 80 L50 44 L69 80 L88 21"
        fill="none" stroke="url(#w)" stroke-width="17"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
